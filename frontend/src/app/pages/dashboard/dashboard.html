<header class="dashboard-header">

  <a class="dashboard-logo" routerLink="/">
    RunOps.
  </a>

  <button class="logout-button" type="button" (click)="logout()" [disabled]="loggingOut()">
    {{ loggingOut() ? 'Cerrando sesión...' : 'Cerrar sesión' }}
  </button>

</header>

<main class="dashboard-content">

  <h1>Mis entrenamientos</h1>

  @if (successMessage()) {
  <p class="success-message" role="status">
    {{ successMessage() }}
  </p>
  }

  @if (deleteErrorMessage()) {
  <p class="logout-error" role="alert">
    {{ deleteErrorMessage() }}
  </p>
  }

  @if (logoutError()) {
  <p class="logout-error" role="alert">
    {{ logoutError() }}
  </p>
  }

  <section id="workout-form-section">

    <app-workout-form [workoutToEdit]="editingWorkout()" (workoutCreated)="onWorkoutCreated()"
      (workoutUpdated)="onWorkoutUpdated()" (editCancelled)="editingWorkout.set(null)" />

  </section>

  <app-workout-history [workouts]="workouts()" [loading]="loading()" [errorMessage]="errorMessage()"
    (workoutDeleted)="deleteWorkout($event)" (workoutEdited)="editWorkout($event)" />

</main>
